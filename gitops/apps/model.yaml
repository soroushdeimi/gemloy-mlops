apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  sources:
  - repoURL: https://github.com/soroushdeimi/gemloy-mlops.git
    targetRevision: main
    path: deploy/charts/llamacpp
    helm:
      releaseName: llamacpp
      valueFiles:
      - ../../../gitops/values/llamacpp.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
