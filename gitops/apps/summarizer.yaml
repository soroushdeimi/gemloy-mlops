apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: summarizer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  sources:
  - repoURL: https://github.com/soroushdeimi/gemloy-mlops.git
    targetRevision: main
    path: deploy/charts/summarizer
    helm:
      releaseName: summarizer
      valueFiles:
      - ../../../gitops/values/summarizer.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
