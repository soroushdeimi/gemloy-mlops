apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-verify
  namespace: platform
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
        node-role.gemloy/gpu: "true"
      tolerations:
        - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
      initContainers:
        - name: nvidia-smi
          image: nvidia/cuda:12.5.0-base-ubuntu22.04
          command: [nvidia-smi]
          resources:
            requests: {cpu: 100m, memory: 128Mi, nvidia.com/gpu: 1}
            limits: {cpu: "1", memory: 256Mi, nvidia.com/gpu: 1}
      containers:
        - name: vector-add
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubi8
          resources:
            requests: {cpu: 100m, memory: 128Mi, nvidia.com/gpu: 1}
            limits: {cpu: "1", memory: 256Mi, nvidia.com/gpu: 1}
