# Source: summarizer/templates/dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: summarizer-dashboard
  labels: {grafana_dashboard: "1"}
data:
  app.json: |
    {
      "title": "Gemloy app",
      "uid": "gemloy-app",
      "schemaVersion": 39,
      "version": 1,
      "tags": [
        "gemloy"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "Requests/s by status",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(summarizer_requests_total{route=\"/summarize\"}[5m]))",
              "legendFormat": "{{instance}} {{kind}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Latency p95",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(summarizer_request_duration_seconds_bucket{route=\"/summarize\"}[5m])))",
              "legendFormat": "{{instance}} {{kind}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Upstream errors/s",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (kind) (rate(summarizer_upstream_errors_total[5m]))",
              "legendFormat": "{{instance}} {{kind}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Tokens/s",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (kind) (rate(summarizer_tokens_total[5m]))",
