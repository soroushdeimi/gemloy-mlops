name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: scripts/install-tools.sh
      - run: echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - run: echo "$PWD/.tools/venv/bin" >> "$GITHUB_PATH"
      - run: make test lint-k8s lint-rules lint-dashboards
      - run: actionlint .github/workflows/ci.yml
  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  bump-gitops:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Update desired image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('gitops/values/summarizer.yaml')
          import yaml
          values = yaml.safe_load(path.read_text()) or {}
          image = values.setdefault('image', {})
          image['repository'] = os.environ['IMAGE']
          image['tag'] = os.environ['IMAGE_TAG']
          path.write_text(yaml.safe_dump(values, sort_keys=False))
          PY
          git config user.name 'release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add gitops/values/summarizer.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update desired image [skip ci]"
          git push origin HEAD:main
