apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
spec:
  groups:
  - name: gemloy.platform
    rules:
    - alert: GPUTemperatureHigh
      expr: (DCGM_FI_DEV_GPU_TEMP or nvidia_smi_temperature_gpu) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: GPU temperature above operating threshold
        runbook_url: docs/runbook.md
    - alert: GPUMemoryNearFull
      expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) or nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes) > 0.98
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: GPU framebuffer nearly full
        runbook_url: docs/runbook.md
    - alert: GPUXIDError
      expr: DCGM_FI_DEV_XID_ERRORS > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: GPU XID fault reported
        runbook_url: docs/runbook.md
    - alert: ModelServerDown
      expr: up{namespace="platform",service="model",engine="vllm"} == 0 or (absent(up{namespace="platform",service="model",engine="vllm"})
        and on() (kube_deployment_spec_replicas{namespace="platform",deployment="vllm"}
        > 0))
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: Model metrics endpoint unavailable
        runbook_url: docs/runbook.md
    - alert: ModelQueueHigh
      expr: vllm:num_requests_waiting > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: More than one batch is waiting
        runbook_url: docs/runbook.md
    - alert: ModelKVCacheHigh
      expr: vllm:kv_cache_usage_perc > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: KV cache usage above budget
        runbook_url: docs/runbook.md
